<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>像素堆叠 · 放置农场 v4.6</title>
<style>
  html,body{margin:0;height:100%;background:#1b2a24;overflow:hidden}
  #wrap{position:absolute;left:0;top:0}
  canvas#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #hud{position:absolute;left:12px;top:12px;color:#fff6dc;font:600 15px/1.45 "Noto Sans CJK SC","Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Serif CJK SC",sans-serif;
       background:rgba(40,28,22,.78);border:3px solid #e8c78a;box-shadow:0 0 0 3px #3a2a20,4px 4px 0 3px rgba(0,0,0,.35);padding:8px 12px;min-width:220px;letter-spacing:.5px}
  #hud .row{display:flex;gap:14px;justify-content:space-between}
  #hud b{color:#ffd76a}
  #act{color:#bff0a0;margin:2px 0}
  #title{position:absolute;right:12px;top:12px;color:#fff6dc;font:600 13px "Noto Sans CJK SC","Noto Serif CJK SC",sans-serif;background:rgba(40,28,22,.6);padding:4px 10px;border:2px solid #e8c78a}
  #log{position:absolute;left:12px;bottom:12px;color:#fff6dc;font:500 13px/1.5 "Noto Sans CJK SC","Noto Serif CJK SC",sans-serif;background:rgba(40,28,22,.62);padding:6px 10px;border:2px solid #b89a66;min-width:240px}
  #log div{opacity:.95}
  canvas#game{cursor:grab} body.grab canvas#game{cursor:grabbing}
  #fakecursor{position:fixed;left:-50px;top:-50px;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #fff6dc;background:rgba(255,215,106,.35);box-shadow:0 0 0 2px #3a2a20;pointer-events:none;z-index:9}
  body.grab #fakecursor{background:rgba(255,215,106,.8);transform:scale(.8)}
  #log div:nth-child(2){opacity:.75}#log div:nth-child(3){opacity:.55}#log div:nth-child(4){opacity:.4}
  #catches{position:absolute;left:12px;bottom:118px;color:#fff6dc;font:500 12px/1.45 "Noto Sans CJK SC","Noto Serif CJK SC",sans-serif;background:rgba(40,28,22,.62);padding:5px 10px;border:2px solid #b89a66;min-width:160px;max-width:260px}
  #catches[hidden]{display:none}#catches b{color:#ffd76a;font-weight:600}#catches .h{opacity:.75;margin-bottom:2px}
  .ico{display:inline-block;width:24px;height:24px;vertical-align:-6px;margin-right:4px;background:url(assets/hud_icons.png) no-repeat;background-size:96px 24px;image-rendering:pixelated}
  .ico.coin{background-position:0 0}.ico.seed{background-position:-24px 0}.ico.carrot{background-position:-48px 0}.ico.cabbage{background-position:-72px 0}
  #prices{font-weight:500;font-size:13px;color:#f3e2b8;margin-top:2px}
  .panel{position:absolute;color:#fff6dc;font:600 13px/1.5 "Noto Sans CJK SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:rgba(40,28,22,.86);border:3px solid #e8c78a;box-shadow:0 0 0 3px #3a2a20,4px 4px 0 3px rgba(0,0,0,.35)}
  #inv{left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;padding:6px 8px}
  .slot{width:62px;height:58px;background:#2a1d16;border:2px solid #8a6a44;box-shadow:inset 0 0 0 2px #1a120e;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
  .slot .n{position:absolute;right:3px;top:1px;font-size:13px;color:#ffd76a;text-shadow:1px 1px 0 #000}
  .slot .k{font-size:11px;font-weight:500;opacity:.8;line-height:1;margin-top:1px}
  .slot.dim{opacity:.45}
  .slot canvas,.slot i{width:32px;height:32px;image-rendering:pixelated;display:block}
  .pips{display:flex;gap:2px;margin-top:2px}.pips b{width:5px;height:5px;background:#3d5f73;box-shadow:0 0 0 1px #10202a}.pips b.on{background:#7ec3e6}
  .pbtn{font:600 13px "Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:#3a2a20;background:#e8c78a;border:2px solid #3a2a20;box-shadow:2px 2px 0 #3a2a20;padding:3px 10px;cursor:pointer}
  .pbtn:hover{background:#ffd98f}.pbtn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #3a2a20}.pbtn.warn{background:#d9826a}
  #menuBtn{position:absolute;right:12px;top:66px}
  #shopBtn{position:absolute;right:86px;top:66px}
  #speed{position:absolute;right:160px;top:66px;display:flex;gap:4px}#speed[hidden]{display:none}
  .pbtn.on{background:#ffd76a;box-shadow:inset 0 0 0 2px #3a2a20}.pbtn[disabled]{opacity:.5;cursor:default;transform:none}
  #shop{right:12px;top:100px;width:420px;max-height:calc(100vh - 200px);overflow:auto;padding:8px 10px}
  #shop .shead{display:flex;align-items:center;gap:12px;margin-bottom:6px}#shop .shead b:first-child{font-size:16px}#shop .shead .x{margin-left:auto;padding:0 7px}
  #shop .cards{display:flex;flex-direction:column;gap:5px}
  #shop .card{display:flex;align-items:center;gap:8px;background:#2a1d16;border:2px solid #8a6a44;box-shadow:inset 0 0 0 2px #1a120e;padding:4px 6px}
  #shop .card.max{opacity:.6}
  #shop .card i{width:32px;height:32px;image-rendering:pixelated;display:block;flex:none}
  #shop .ct{flex:1;min-width:0}#shop .lv{font-weight:500;font-size:11px;opacity:.75}#shop .d{font-weight:500;font-size:12px;opacity:.85}
  #shop .cb{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none}#shop .short{font-size:11px;color:#f0a090;font-weight:500}#shop .done{color:#8fd35a;font-size:18px}
  #menu{right:12px;top:100px;width:300px;padding:10px 12px}
  #menu .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  #menu textarea{width:100%;box-sizing:border-box;height:64px;font:11px monospace;background:#1a120e;color:#fff6dc;border:2px solid #8a6a44;resize:none}
  #menu .note{font-weight:500;font-size:12px;opacity:.85}
  #menu .bad{color:#ffb39a}
  #offline{left:50%;top:40%;transform:translate(-50%,-50%);padding:14px 18px;min-width:280px;text-align:center;font-size:14px}
  #offline h3{margin:0 0 6px;font-size:16px;color:#ffd76a}
  #minimap{right:12px;top:100px;width:224px;height:140px;padding:0;cursor:pointer;image-rendering:auto}#minimap[hidden]{display:none}
  #mapBtn{position:absolute;right:12px;bottom:12px}
  #tools{position:absolute;right:76px;bottom:12px;display:flex;gap:4px}#tools[hidden]{display:none}
  #shop,#menu{z-index:3}
  .rlab{position:absolute;transform:translate(-50%,-100%);padding:2px 8px;font-size:12px;line-height:16px;white-space:nowrap;cursor:pointer;text-align:center;color:#ffe9b0}.rlab b{color:#ffd76a}.rlab[hidden]{display:none}
  #say{left:50%;top:76px;transform:translateX(-50%);padding:4px 12px;pointer-events:none}#say[hidden]{display:none}
  #shop .sec{font-size:12px;opacity:.7;margin:6px 0 0}#shop .look{padding:0 6px;font-size:12px;margin-top:2px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="row"><span id="day">第 1 天</span><span id="clock">06:00</span></div>
    <div id="act">当前：起床</div>
    <div class="row"><span><i class="ico coin"></i>金币 <b id="coins">0</b></span><span><i class="ico seed"></i>仓库种子 <b id="seeds">0</b></span></div>
    <div id="prices">今日行情：</div>
  </div>
  <div id="title">像素堆叠 · 放置农场 v4.6 · 钓鱼和海边（自动运行）<br><span style="font-weight:400;opacity:.8">拖动 / W A S D 平移 · Shift+拖动 / Q E 旋转 · R 回家 · 滚轮缩放</span></div>
  <div id="log"></div>
  <div id="catches" hidden></div>
  <div id="inv" class="panel"></div>
  <button id="menuBtn" class="pbtn" title="存档菜单">存档 ▾</button>
  <button id="shopBtn" class="pbtn" title="商店（B）">商店 B</button>
  <div id="speed" hidden></div>
  <div id="shop" class="panel" hidden></div>
  <div id="menu" class="panel" hidden></div>
  <div id="offline" class="panel" hidden></div>
  <canvas id="minimap" class="panel" title="小地图：点一下看那里"></canvas>
  <button id="mapBtn" class="pbtn" title="小地图（M）">地图 M</button>
  <div id="tools" hidden></div>
  <div id="say" class="panel" hidden></div>
  <div id="rlabs"></div>
</div>
<script src="assets/palette.js"></script>
<script src="assets/sprites.js"></script>
<script src="sim.js"></script>
<script src="world.js"></script>
<script src="animals.js"></script>
<script src="fish.js"></script>
<script src="save.js"></script>
<script src="fx.js"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
