name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

# The previous single `check` job hit the 50-minute timeout after v5.10.7
# added inn-shots.js (run 44622565450, 50m15s). Nothing hung: every finished
# step succeeded. Unit tests took a few seconds; ~21 browser scripts then ran
# one after another for 45+ minutes. The job was cancelled mid careers-shots,
# so inn-shots never started. Slowest completed steps: market-shots 5.5m,
# works-shots 5.0m, save-smoke 5.0m, home-shots 4.4m, decor-shots 4.1m.
# Split into a fast unit job plus a matrix of browser groups (npm cached)
# so wall time stays well under 50 minutes. No script is run twice.

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Syntax check (node --check)
        run: |
          for f in game.js fog.js diary.js diary-ui.js album.js album-ui.js fx.js sim.js save.js world.js plots.js expansion.js plots-ui.js wood.js path.js animals.js fish.js family.js kids.js surprise.js weather.js insects.js codex.js codex_icons.js playlog.js ui.js events-ui.js audio.js home.js home-art.js bakery.js woodshop.js smithy.js school.js library.js clinic.js festival.js events.js hall.js careers.js inn.js inn-art.js market.js slots.js yard.js town.js town-bldg.js town-art.js assets/*.js tools/*.js; do echo "check $f"; node --check "$f"; done
      - name: Unit tests
        run: |
          set -e
          node tools/save-test.js
          node tools/playlog-test.js
          node tools/surprise-test.js
          node tools/path-test.js
          node tools/plots-test.js
          node tools/wood-test.js
          node tools/codex-test.js
          node tools/weather-test.js
          node tools/kids-test.js
          node tools/works-test.js
          node tools/decor-test.js
          node tools/town-test.js
          node tools/home-test.js
          node tools/hall-test.js
          node tools/market-test.js
          node tools/slots-test.js
          node tools/yard-test.js
          node tools/bakery-test.js
          node tools/workshop-test.js
          node tools/careers-test.js
          node tools/inn-test.js
          node tools/resort-test.js
          node tools/school-test.js
          node tools/clinic-test.js
          node tools/festival-test.js
          node tools/events-test.js
          node tools/econ-test.js
          node tools/townscale-test.js
          node tools/diary-test.js
          node tools/album-test.js
          node tools/save-compact-test.js
          node tools/fog-test.js
          node tools/kids-test.js

  shots:
    name: shots (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # ~7.5m on run 44622565450 (save-smoke alone was 5.0m)
          - group: smoke
            scripts: smoke.js save-smoke.js surprise-smoke.js audio-smoke.js codex-smoke.js plots-smoke.js playlog-smoke.js clinic-shots.js fill-shots.js
          # ~13.5m (works 5.0m, decor 4.1m, town 3.6m, school-walk 0.8m)
          - group: works-town
            # v5.11.0.15: party-shots (~1.5m locally); works-town 14m01s on main run 44800040270, ample headroom
            scripts: works-shots.js decor-shots.js town-shots.js school-walk-shots.js party-shots.js
          # ~7.3m (home 4.4m, polish 1.2m, cottage 1.7m)
          - group: home
            scripts: home-shots.js polish-shots.js cottage-shots.js fixroad-shots.js fixws-shots.js fishdiary-shots.js touchhooks-shots.js coast-shots.js pine-shots.js kidslove-shots.js
          # ~10.9m (hall 3.8m, econ 1.1m, nospeed 0.5m, market 5.5m)
          - group: hall-market
          # v5.11.0.8: + rain-shots from recent-b (recent-b ran 24m39s, hall-market 9m44s on run 44743060653)
          # v5.11.0.10: rain-shots back to recent-b (hall-market reached ~24.5m with it; recent-b ~12m on run 44752013174)
            scripts: hall-shots.js econ-shots.js nospeed-shots.js market-shots.js countdown-shots.js
          # v5.10.10: split `recent` (it ran 29m04s of a 30m limit on #56). Keep the aggregator job named `check`.
          - group: recent-a
            scripts: bakery-shots.js workshop-shots.js careers-shots.js festival-shots.js
          # v5.11.0: recent-b ran 23m39s (inn 7.4m, resort 7.2m, school 4.6m, clinic 4.3m) on run 44683475759; school -> townscale, clinic -> smoke
          # v5.11.0.5: + agrilot-shots (农家乐区, ~5m locally); recent-b was 11m on run 44697205625
          - group: recent-b
          # v5.11.0.4: rain-shots (~7m on CI) joins the lightest leg (11m50s on run 44701568250; smoke with it was 21m52s)
          # v5.11.0.12: rain-shots -> agrilot (recent-b was 24m43s with rain on album run 44777224060; inn+resort stay here)
            scripts: inn-shots.js resort-shots.js
          # v5.11.0.9 房子比例: the scale audit (every building beside a grown-up, ~10s) and the district / town / farm / seaside
          # shots with door routes and perf (~5m on CI)
          # v5.11.0.11: + offline-shots and album-shots from townscale (townscale hit 25m13s with them on run 44772874375: v5110 15m, school 5m,
          # offline 2.5m, album 2.6m; scale was 6.5m)
          - group: scale
          # v5.11.0.13: + rain-shots from agrilot (scale was 9m41s on run 44782373476; rain ~7m → ~17m)
          # v5.11.0.14: + housemove-shots (~1–2m locally; expected ~18–19m, >=3m headroom under 25m)
          # v5.11.0.15: scale exceeded 22m on run 44815889988; isolate rain instead of passing the overload to another leg.
            scripts: scale-audit.js scale-shots.js offline-shots.js album-shots.js housemove-shots.js
          - group: weather
          # v5.11.0.17: + water-shots (河口 / flowing water / wheels, ~1.5–2m locally); weather was rain alone (~7m)
            scripts: rain-shots.js water-shots.js
          # v5.11.0 小镇放大: its own leg (overview, scale, feast square, market, two-storey street, minimap, mobile, fixtures, routes)
          # v5.11.0.8: + offline-shots (~1.5m; home was 19m40s with it on run 44730151787, townscale 14m)
          - group: townscale
            scripts: v5110-shots.js school-shots.js
          # v5.11.0.5 农家乐区: its own leg (~11m on CI: recent-b went 11m -> 22m16s with it on run 44703708506; with rain-shots there too it would pass 25m)
          # v5.11.0.6: fog-shots (~4m) here, not in home (home hit 23m00s with it on run 44715831725; agrilot alone was 7m)
          # v5.11.0.7: + hotbar-shots (~1m); agrilot was the lightest leg (5–9m on runs 44727901332 / 44729908140)
          # v5.11.0.13: fog-shots -> fog2-shots (the opaque cloud; ~4m locally, like the old one)
          - group: agrilot
          # v5.11.0.12: + restaurant-shots (~1m, two shop-panel snaps) and rain-shots from recent-b
            # (album run 44777224060: agrilot 11m44s with fog+hotbar, recent-b 24m43s with rain;
            #  expected agrilot ~19–20m with rain+restaurant, >=3m headroom under 25m)
            # v5.11.0.13: fog-shots -> fog2-shots (~3m more than the old one), so rain-shots (~7m) goes on to scale (9m41s on run 44782373476)
            scripts: agrilot-shots.js fog2-shots.js hotbar-shots.js restaurant-shots.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install playwright-core (no browser download; uses the runner's Chrome)
        run: npm --prefix tools ci --no-audit --no-fund
      - name: Browser tests (${{ matrix.group }})
        env:
          CHROME: /usr/bin/google-chrome
          PF_SHOTS: /tmp/pf-shots
        run: |
          set -euo pipefail
          for s in ${{ matrix.scripts }}; do
            echo "::group::node tools/$s"
            node "tools/$s"
            echo "::endgroup::"
          done

  # Keeps the required check name `check`. Succeeds only when unit and every
  # shots matrix leg succeeded.
  check:
    name: check
    needs: [unit, shots]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm all CI jobs succeeded
        run: |
          echo "unit=${{ needs.unit.result }}"
          echo "shots=${{ needs.shots.result }}"
          test "${{ needs.unit.result }}" = success
          test "${{ needs.shots.result }}" = success
