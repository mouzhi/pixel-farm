name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check (node --check)
        run: |
          for f in game.js fx.js sim.js save.js world.js plots.js expansion.js plots-ui.js wood.js path.js animals.js fish.js family.js kids.js surprise.js weather.js insects.js codex.js codex_icons.js playlog.js ui.js audio.js home.js home-art.js assets/*.js tools/*.js; do echo "check $f"; node --check "$f"; done
      - name: Install playwright-core (no browser download; uses the runner's Chrome)
        run: npm --prefix tools ci --no-audit --no-fund
      - name: Headless smoke test
        env:
          CHROME: /usr/bin/google-chrome
        run: node tools/smoke.js
      - name: Save / sim unit tests
        run: node tools/save-test.js
      - name: Save / load browser test
        env:
          CHROME: /usr/bin/google-chrome
        run: node tools/save-smoke.js
      - name: Playlog unit tests
        run: node tools/playlog-test.js
      - name: Surprise unit tests
        run: node tools/surprise-test.js
      - name: Pathfinding unit tests
        run: node tools/path-test.js
      - name: Outer ring plots unit tests
        run: node tools/plots-test.js
      - name: Wood automation unit tests
        run: node tools/wood-test.js
      - name: Codex / achievement unit tests
        run: node tools/codex-test.js
      - name: Weather / insect unit tests
        run: node tools/weather-test.js
      - name: Kids growth / play unit tests
        run: node tools/kids-test.js
      - name: Phase 8 (works) unit tests
        run: node tools/works-test.js
      - name: Phase 9 (decor) unit tests
        run: node tools/decor-test.js
      - name: Phase 10 (school, classmates, town) unit tests
        run: node tools/town-test.js
      - name: Phase 11 (new house, weddings, closeness) unit tests
        run: node tools/home-test.js
      - name: Surprise browser test
        env:
          CHROME: /usr/bin/google-chrome
        run: node tools/surprise-smoke.js
      - name: Audio browser test
        env:
          CHROME: /usr/bin/google-chrome
        run: node tools/audio-smoke.js
      - name: Codex browser test
        env:
          CHROME: /usr/bin/google-chrome
        run: node tools/codex-smoke.js
      - name: Outer ring browser test
        env:
          CHROME: /usr/bin/google-chrome
        run: node tools/plots-smoke.js
      - name: Playlog folder-sync browser test
        env:
          CHROME: /usr/bin/google-chrome
        run: node tools/playlog-smoke.js
      - name: Phase 8 browser test (sprinklers, workshops, lamps, hives, second pens, herding)
        env:
          CHROME: /usr/bin/google-chrome
          PF_SHOTS: /tmp/pf-shots
        run: node tools/works-shots.js
      - name: Phase 9 browser test (decor shop, auto placing, moving, night lamps, party, codex page, day-59 save)
        env:
          CHROME: /usr/bin/google-chrome
          PF_SHOTS: /tmp/pf-shots
        run: node tools/decor-shots.js
      - name: Phase 10 browser test (school road, the town, classmates, days off, town shop, party guests from town, day-59 save)
        env:
          CHROME: /usr/bin/google-chrome
          PF_SHOTS: /tmp/pf-shots
        run: node tools/town-shots.js
      - name: v5.8.1 browser test (nothing in hand on the school walk, day-59 save)
        env:
          CHROME: /usr/bin/google-chrome
          PF_SHOTS: /tmp/pf-shots
        run: node tools/school-walk-shots.js
      - name: Phase 11 browser test (the new house, closeness panel, wedding, the couple's little farm, helping, night, reload, day-59 save)
        env:
          CHROME: /usr/bin/google-chrome
          PF_SHOTS: /tmp/pf-shots
        run: node tools/home-shots.js
      - name: v5.9.1 browser test (night light cache, one-row toolbar, welcome-back after 10 minutes, merged surprises, saplings with no room, town at night, day-59 save)
        env:
          CHROME: /usr/bin/google-chrome
          PF_SHOTS: /tmp/pf-shots
        run: node tools/polish-shots.js
